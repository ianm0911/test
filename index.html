<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer with Animated Rotation</title>
  <style>
    body { margin: 0; }
    canvas { display: block; }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
    }
    button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- 버튼 컨트롤 -->
  <div id="controls">
    <button id="rotateFront">Front</button>
    <button id="rotateBack">Back</button>
    <button id="rotateLeft">Left</button>
    <button id="rotateRight">Right</button>
    <button id="rotateTop">Top</button>
    <button id="rotateBottom">Bottom</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    // Scene, Camera, and Renderer setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const light = new THREE.AmbientLight(0xffffff, 1);
    scene.add(light);

    // OrbitControls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    let model; // 모델 참조를 저장할 변수

    // Load glTF model
    const loader = new THREE.GLTFLoader();
    loader.load(
      "model/dies.glb",
      function (gltf) {
        model = gltf.scene;
        model.scale.set(1, 1, 1); // 모델 크기 설정
        model.position.set(0, 0, 0); // 모델 위치 설정
        scene.add(model);
      },
      undefined,
      function (error) {
        console.error(error);
      }
    );

    camera.position.z = 5;

    // Resize handling
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Rotate model to specific angles
    function rotateModelTo(x, y, z) {
      if (model) {
        gsap.to(model.rotation, {
          x: x,
          y: y,
          z: z,
          duration: 1, // 애니메이션 지속 시간 (초)
          ease: "power1.inOut", // 부드러운 애니메이션
        });
      }
    }

    // Button click handlers
    document.getElementById("rotateFront").addEventListener("click", () => {
      rotateModelTo(0, 0, 0); // 앞면 (정면)
    });

    document.getElementById("rotateBack").addEventListener("click", () => {
      rotateModelTo(0, Math.PI, 0); // 뒷면
    });

    document.getElementById("rotateLeft").addEventListener("click", () => {
      rotateModelTo(0, -Math.PI / 2, 0); // 왼쪽면
    });

    document.getElementById("rotateRight").addEventListener("click", () => {
      rotateModelTo(0, Math.PI / 2, 0); // 오른쪽면
    });

    document.getElementById("rotateTop").addEventListener("click", () => {
      rotateModelTo(-Math.PI / 2, 0, 0); // 윗면
    });

    document.getElementById("rotateBottom").addEventListener("click", () => {
      rotateModelTo(Math.PI / 2, 0, 0); // 아랫면
    });

    function rotateToRandomFace() {
  rotateModelTo(
    Math.random() * Math.PI * 2,
    Math.random() * Math.PI * 2,
    Math.random() * Math.PI * 2
  );
}


    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update(); // OrbitControls 업데이트
      renderer.render(scene, camera);
    }
    animate();
  </script>

</body>
</html>
