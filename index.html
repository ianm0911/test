<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer - Random Rotation</title>
  <style>
    body { margin: 0; }
    canvas { display: block; }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
    }
    button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- 버튼 컨트롤 -->
  <div id="controls">
    <button id="randomRotate">Random Face to Camera</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    // Scene, Camera, and Renderer setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const light = new THREE.AmbientLight(0xffffff, 1);
    scene.add(light);

    let model; // 모델 참조를 저장할 변수

    // Load glTF model
    const loader = new THREE.GLTFLoader();
    loader.load(
      "model/dies.glb",
      function (gltf) {
        model = gltf.scene;
        model.scale.set(1, 1, 1); // 모델 크기 설정
        model.position.set(0, 0, 0); // 모델 위치 설정
        scene.add(model);
      },
      undefined,
      function (error) {
        console.error(error);
      }
    );

    // 카메라 정면 고정
    camera.position.set(0, 0, 5);
    camera.lookAt(0, 0, 0);

    // Resize handling
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 랜덤 회전 + 정렬
    function randomRotateToFace() {
      if (!model) return;

      // 랜덤한 회전 생성
      const randomX = 100+Math.random() * Math.PI * 3;
      const randomY = 100+Math.random() * Math.PI * 3;
      const randomZ = 100+Math.random() * Math.PI * 3;

      // 최종 정렬될 특정 면
      const targetFace = [
        { x: 0, y: 0, z: 0 },                 // Front
        { x: 0, y: Math.PI, z: 0 },           // Back
        { x: 0, y: -Math.PI / 2, z: 0 },      // Left
        { x: 0, y: Math.PI / 2, z: 0 },       // Right
        { x: -Math.PI / 2, y: 0, z: 0 },      // Top
        { x: Math.PI / 2, y: 0, z: 0 }        // Bottom
      ];

      const randomIndex = Math.floor(Math.random() * targetFace.length);
      const finalFace = targetFace[randomIndex];

      // 애니메이션 설정 (랜덤 회전 -> 최종 정렬)
      gsap.timeline()
        .to(model.rotation, {
          x: randomX,
          y: randomY,
          z: randomZ,
          duration: 1, // 랜덤 회전 지속 시간
          ease: "power2.inOut"
        })
        .to(model.rotation, {
          x: finalFace.x,
          y: finalFace.y,
          z: finalFace.z,
          duration: 0.1, // 최종 정렬 지속 시간
          ease: "power2.inOut"
        });
    }

   // 버튼 요소 가져오기
const button = document.getElementById("randomRotate");

// 애니메이션 진행 여부를 나타내는 플래그
let isAnimating = false;

// 버튼 클릭 이벤트 리스너 추가
button.addEventListener("click", () => {
  if (isAnimating) return; // 애니메이션 중일 때 클릭 방지

  isAnimating = true; // 애니메이션 시작 플래그 설정
  button.disabled = true; // 버튼 비활성화

  randomRotateToFace(() => {
    // 애니메이션 종료 콜백에서 플래그 및 버튼 상태 복원
    isAnimating = false;
    button.disabled = false;
  });
});

// Animation loop
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

// randomRotateToFace 함수 수정
function randomRotateToFace(callback) {
  // 애니메이션 동작 구현 (약 1초간 실행)
  const duration = 1000; // 1초
  const startTime = performance.now();

  function rotationAnimation(currentTime) {
    const elapsedTime = currentTime - startTime;
    const progress = Math.min(elapsedTime / duration, 1); // 진행률 계산 (0~1)

    // 회전 로직 업데이트
    // 예: target.rotation.y = startRotation + progress * (endRotation - startRotation);

    if (progress < 1) {
      requestAnimationFrame(rotationAnimation);
    } else {
      // 애니메이션 완료 시 콜백 호출
      if (callback) callback();
    }
  }

  requestAnimationFrame(rotationAnimation);
}

  </script>

</body>
</html>
