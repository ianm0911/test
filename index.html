<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer with Buttons</title>
  <style>
    body { margin: 0; }
    canvas { display: block; }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
    }
    button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- 버튼 컨트롤 -->
  <div id="controls">
    <button id="rotateX">Rotate X</button>
    <button id="rotateY">Rotate Y</button>
    <button id="rotateZ">Rotate Z</button>
    <button id="randomRotate">Random Rotate</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // Scene, Camera, and Renderer setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const light = new THREE.AmbientLight(0xffffff, 1);
    scene.add(light);

    // OrbitControls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    let model; // 모델 참조를 저장할 변수

    // Load glTF model
    const loader = new THREE.GLTFLoader();
    loader.load(
      "model/dies.glb",
      function (gltf) {
        model = gltf.scene;
        model.scale.set(1, 1, 1); // 모델 크기 설정
        model.position.set(0, 0, 0); // 모델 위치 설정
        scene.add(model);
      },
      undefined,
      function (error) {
        console.error(error);
      }
    );

    camera.position.z = 5;

    // Resize handling
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Button click handlers
    document.getElementById("rotateX").addEventListener("click", () => {
      if (model) model.rotation.x += Math.PI / 4; // X축으로 45도 회전
    });

    document.getElementById("rotateY").addEventListener("click", () => {
      if (model) model.rotation.y += Math.PI / 4; // Y축으로 45도 회전
    });

    document.getElementById("rotateZ").addEventListener("click", () => {
      if (model) model.rotation.z += Math.PI / 4; // Z축으로 45도 회전
    });

    document.getElementById("randomRotate").addEventListener("click", () => {
      if (model) {
        model.rotation.x = Math.random() * Math.PI * 2; // X축 랜덤 회전
        model.rotation.y = Math.random() * Math.PI * 2; // Y축 랜덤 회전
        model.rotation.z = Math.random() * Math.PI * 2; // Z축 랜덤 회전
      }
    });

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update(); // OrbitControls 업데이트
      renderer.render(scene, camera);
    }
    animate();
  </script>

</body>
</html>
